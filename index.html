<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Church Directory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="loginView" class="card">
      <img class="church-logo" src="IMG_2211.jpeg" alt="Faith Tabernacle">
      <h1>Church Directory</h1>
      <p class="muted">Sign in with your church phone number to view the directory.</p>

      <form id="phoneForm">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel"
               placeholder="+1 859 555 1234" required>
        <button type="submit">Send verification code</button>
      </form>

      <form id="codeForm" class="hidden">
        <label for="code">Verification code</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" placeholder="123456" required>
        <button type="submit">Verify &amp; view directory</button>
        <button id="changeNumber" type="button" class="secondary">Use a different number</button>
      </form>

      <div id="recaptcha-container"></div>
      <p id="message" class="message"></p>
    </section>

    <section id="directoryView" class="hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">Church Directory</p>
          <h1>Members</h1>
        </div>
        <button id="signOut" class="secondary small">Sign out</button>
      </header>

      <input id="search" class="search" type="search" placeholder="Search names…"
             aria-label="Search directory">

      <div id="directoryList" class="directory-list"></div>
      <p id="empty" class="muted hidden">No members found.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
